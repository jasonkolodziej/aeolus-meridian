[project]
name = "aeolus-meridian"
version = "2.1.0"
description = "AEOLUS deterministic hurricane forecast engine + MERIDIAN diffusion ensemble generator (Scope v2.1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Torch-backed model implementations. Kept optional so the operational logic
# (scheduling, availability, curriculum, promotion, metrics) can be installed,
# tested and run on machines without a GPU or a torch wheel.
torch = [
    "torch>=2.2",
]
# MLflow tracking. The tracking layer degrades to a local JSON store when
# MLflow is absent (see aeolus.tracking.registry), per Scope v2.1 §10.1.
tracking = [
    "mlflow>=2.12",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
all = [
    "aeolus-meridian[torch,tracking,dev]",
]

[project.scripts]
aeolus = "aeolus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeolus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "torch: requires the optional torch extra (skipped automatically if absent)",
    "slow: long-running training-shaped tests",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
